appId: in.ac.nsut.connect
---
- launchApp:
    clearState: true
- tapOn: "Enter student demo"
- tapOn: "Maybe later"
- tapOn: "Timetable"
- tapOn: "Filter Mon"
- assertVisible: "Design & Analysis of Algorithms"
- stopApp
- setAirplaneMode: true
- launchApp
- tapOn: "Timetable"
- tapOn: "Filter Mon"
- assertVisible: "Design & Analysis of Algorithms"
- setAirplaneMode: false
- tapOn: "Refresh timetable"
